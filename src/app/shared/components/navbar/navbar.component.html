<div class="card">
  <p-menubar [model]="items">
    <ng-template pTemplate="start">
      <figure class="my-1 mx-3 md:mx-7">
        <img class="w-3rem navbar-logo" src="../assets/imgs/logo.png" alt="">
      </figure>
    </ng-template>

    <ng-template pTemplate="item" let-item let-root="root">
      <a pRipple routerLinkActive="active-link" [routerLink]="item.routerLink"
        class="nav-link p-menuitem-link inline-flex align-items-center p-3">
        <span [class]="item.icon"></span>
        <span class="ml-2">{{ item.label }}</span>
      </a>
    </ng-template>
  </p-menubar>
</div>
